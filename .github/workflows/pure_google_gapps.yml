name: Pure Google Official GApps Monthly Sync & Release

on:
  schedule:
    # Runs monthly (on the 1st day of every month at 00:00 UTC)
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build all versions even if no new update detected on Google servers"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Check for updates directly from Google's official XML feed
  # =========================================================================
  check-for-updates:
    name: Check Google Official Updates
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      matrix: ${{ steps.check.outputs.matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      revisions_b64: ${{ steps.state.outputs.revisions_b64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compile All Python Modules & Verify res/ + patch/ Parity
        run: |
          python3 -m py_compile *.py core/*.py analyzer/*.py patch/*.py
          python3 -m patch

      - name: Fetch previous state from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Checking for previous release state asset..."
          gh release download release --pattern "latest_revisions.json" --output latest_revisions.json || true
          if [ -f "latest_revisions.json" ]; then
            echo "[✓] Found existing release state JSON."
          else
            echo "[*] No previous release state found. Performing fresh scan."
          fi

      - name: Query dl.google.com for latest official updates
        id: check
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_build }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FORCE_FLAG="--force"
          fi

          python3 check_updates.py \
            --state-file latest_revisions.json \
            --output-json latest_revisions.json $FORCE_FLAG

      - name: Ensure Permanent Release Exists & Export State Output
        id: state
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="release"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "[*] Creating single permanent release '$RELEASE_TAG'..."
            gh release create "$RELEASE_TAG" \
              --title "Pure Google GApps" \
              --notes "" \
              --latest
          fi
          B64_STATE=$(base64 -w 0 latest_revisions.json)
          echo "revisions_b64=$B64_STATE" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 2. Extract & Build in Parallel -> Strictly Verify -> Upload to Release
  # =========================================================================
  build-gapps:
    name: Build Android ${{ matrix.androidv }} (${{ matrix.arch }})
    needs: check-for-updates
    if: needs.check-for-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-for-updates.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Strictly Verify Python Syntax & res/ + patch/ Before Build
        run: |
          python3 -m py_compile *.py core/*.py analyzer/*.py patch/*.py
          python3 -m patch

      - name: Install High-Speed Extraction & Android SDK Utilities (aria2, 7z, erofs, aapt2, zipalign, SDK ${{ matrix.api }})
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            aria2 \
            p7zip-full \
            unzip \
            android-sdk-libsparse-utils \
            erofs-utils \
            e2fsprogs \
            aapt \
            zipalign \
            apksigner \
            android-sdk-platform-23

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TARGET_API="${{ matrix.api }}"
          if [ -n "$TARGET_API" ] && [ ! -f "$SDK_ROOT/platforms/android-$TARGET_API/android.jar" ]; then
            SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1 || which sdkmanager 2>/dev/null || true)
            if [ -n "$SDKMGR" ]; then
              echo "[*] Installing official Android SDK Platform android-$TARGET_API via sdkmanager..."
              yes | "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-$TARGET_API" >/dev/null 2>&1 || true
            fi
          fi

      - name: Extract & Package Pure Google GApps
        run: |
          python3 extract_pure_gapps.py \
            --android "${{ matrix.androidv }}" \
            --arch "${{ matrix.arch }}" \
            --abi "${{ matrix.abi }}" \
            --url "${{ matrix.url }}" \
            --out-dir "out_packages"

      - name: Strictly Verify Built Package & Generate Matrix Analysis Fragment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_FILE=$(ls out_packages/GoogleGapps-*.zip | head -n 1)
          FRAG_FILE="out_packages/report-${{ matrix.androidv }}-${{ matrix.arch }}.json"
          python3 analyze_all_releases.py \
            --version "${{ matrix.androidv }}" \
            --arch "${{ matrix.arch }}" \
            --local-zip "$ZIP_FILE" \
            --save-fragment "$FRAG_FILE" \
            --strict-gate

      - name: Upload Tiny Matrix Report Fragment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-fragment-${{ matrix.androidv }}-${{ matrix.arch }}
          path: out_packages/report-${{ matrix.androidv }}-${{ matrix.arch }}.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Verified Package Directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="release"
          ls -lh out_packages/*.zip
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" out_packages/*.zip --clobber; then
              echo "[✓] Uploaded directly to '$RELEASE_TAG' release on attempt $attempt."
              exit 0
            fi
            echo "[!] Upload attempt $attempt failed, retrying in $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          exit 1

  # =========================================================================
  # 3. Finalize Release State & Publish Merged Analysis Report Artifact
  # =========================================================================
  publish-release:
    name: Finalize Release & Publish Analysis Report
    needs: [check-for-updates, build-gapps]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Update Release State JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISIONS_B64: ${{ needs.check-for-updates.outputs.revisions_b64 }}
        run: |
          if [ -n "$REVISIONS_B64" ]; then
            echo "$REVISIONS_B64" | base64 -d > latest_revisions.json
            gh release upload release latest_revisions.json --clobber
            echo "[✓] Updated latest_revisions.json in 'release'."
          fi

      - name: Download Matrix Report Fragments
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: report-fragment-*
          path: report_fragments
          merge-multiple: true

      - name: Clean Up Temporary Fragment Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name | startswith("report-fragment-")) | .id' 2>/dev/null || true)
          for id in $ART_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || true
          done
          echo "[✓] Cleaned up temporary matrix report fragments."

      - name: Merge Matrix Reports & Publish Final Comparison Tables
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 analyze_all_releases.py --merge-fragments report_fragments || true
          if [ -f "gapps_comparison_report.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat gapps_comparison_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Final Analysis Report Artifact (Not in Release)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gapps-comparison-report
          path: |
            gapps_comparison_report.json
            gapps_comparison_report.txt
            gapps_comparison_report.md
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn



