name: Test Android 13 GApps Build & Deep Analysis (Cached)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture (both, arm64, or x86_64)"
        required: false
        default: "both"
        type: string

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare-matrix:
    name: Resolve Android 13 Official Google URLs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile All Python Modules & Verify res/ + patch/ Parity
        run: |
          python3 -m py_compile *.py core/*.py analyzer/*.py patch/*.py
          python3 -m patch

      - name: Resolve Android 13.0.0 URLs from dl.google.com
        id: resolve
        run: |
          python3 -c '
          import os, json, check_updates
          imgs = check_updates.fetch_google_repository_metadata()
          req_arch = "${{ github.event.inputs.arch }}" or "both"
          inc = []
          for k, v in sorted(imgs.items()):
              if v["android_version"] == "13.0.0":
                  if req_arch in ("both", "", v["arch"]):
                      inc.append({
                          "androidv": v["android_version"],
                          "arch": v["arch"],
                          "abi": v["abi"],
                          "url": v["url"],
                          "checksum": v["checksum"],
                      })
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": inc}) + "\n")
          '

  test-build-android13:
    name: Test Build Android 13.0.0 (${{ matrix.arch }})
    needs: prepare-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache APT Packages (.deb archives)
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /tmp/apt-cache
          key: apt-debs-ubuntu2404-v1

      - name: Install Extraction & Signing Utilities (with APT Cache)
        run: |
          sudo mkdir -p /tmp/apt-cache/partial
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" == "true" ] && ls /tmp/apt-cache/*.deb >/dev/null 2>&1; then
            echo "[⚡] Restoring APT packages from cache..."
            sudo cp -n /tmp/apt-cache/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Dir::Cache::Archives="/var/cache/apt/archives" \
            aria2 \
            p7zip-full \
            unzip \
            android-sdk-libsparse-utils \
            erofs-utils \
            e2fsprogs \
            aapt \
            apksigner \
            android-sdk-platform-23
          sudo cp -n /var/cache/apt/archives/*.deb /tmp/apt-cache/ 2>/dev/null || true

      - name: Cache Python Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-v1

      - name: Cache Downloaded Official Google SDK System Image (${{ matrix.androidv }}-${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/pure_gapps_downloads
          key: google-sysimg-${{ matrix.androidv }}-${{ matrix.arch }}-${{ matrix.checksum }}

      - name: Extract & Package Pure Google GApps (Cached SDK Image + Local Static Assets)
        run: |
          python3 extract_pure_gapps.py \
            --android "${{ matrix.androidv }}" \
            --arch "${{ matrix.arch }}" \
            --abi "${{ matrix.abi }}" \
            --url "${{ matrix.url }}" \
            --out-dir "out_packages" \
            --cache-dir "$HOME/.cache/pure_gapps_downloads"

      - name: Analyze Built ZIP vs MindTheGapps (Tree + XML + APK Versions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_FILE=$(ls out_packages/GoogleGapps-*.zip | head -n 1)
          python3 analyze_all_releases.py \
            --version "${{ matrix.androidv }}" \
            --arch "${{ matrix.arch }}" \
            --local-zip "$ZIP_FILE" \
            --save-fragment "out_packages/report-${{ matrix.androidv }}-${{ matrix.arch }}.json" \
            --strict-gate

      - name: Upload Matrix Report Fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-fragment-${{ matrix.androidv }}-${{ matrix.arch }}
          path: out_packages/report-${{ matrix.androidv }}-${{ matrix.arch }}.json
          compression-level: 0
          retention-days: 1

  merge-test-report:
    name: Merge & Inspect Android 13 Comparison Report
    needs: [prepare-matrix, test-build-android13]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Matrix Report Fragments
        uses: actions/download-artifact@v4
        with:
          pattern: test-fragment-*
          path: report_fragments
          merge-multiple: true

      - name: Generate Final Android 13 Comparison Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 analyze_all_releases.py \
            --version "13.0.0" \
            --merge-fragments report_fragments
          if [ -f "gapps_comparison_report.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat gapps_comparison_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          cat gapps_comparison_report.md

      - name: Upload Final Test Comparison Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-android13-comparison-report
          path: |
            gapps_comparison_report.json
            gapps_comparison_report.txt
            gapps_comparison_report.md
          compression-level: 0
          retention-days: 7

